[project]
name = "ctxbench"
version = "0.1.0"
description = "Controlled comparison of context-management strategies for coding agents on SWE-bench Verified"
requires-python = ">=3.10"
dependencies = [
    "litellm>=1.40",
    "datasets>=2.18",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
eval = ["swebench>=3.0"]
analysis = ["pandas>=2.0", "matplotlib>=3.8", "jupyter"]
dev = ["pytest>=8.0"]

[project.scripts]
ctxbench = "ctxbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctxbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
