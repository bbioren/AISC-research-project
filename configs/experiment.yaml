# Settings for the main experiment. If you want to try something different, copy this
# file (e.g. pilot.yaml) instead of changing it while runs are going.
run_name: pilot-v1
subset: configs/subset_50_seed0.txt   # make it with: ctxbench subset --n 50 --seed 0
dataset: princeton-nlp/SWE-bench_Verified

# Every condition uses the same model. Go cheap for the pilot. We're comparing
# strategies to each other, so keeping the model fixed matters more than a high resolve rate.
model:
  model: gpt-4o-mini        # any model name LiteLLM understands
  temperature: 0.0
  max_tokens: 2048
summarizer_model:           # only the summarization strategies use this
  model: gpt-4o-mini
  temperature: 0.0
  max_tokens: 1024

agent:
  step_limit: 50
  cost_limit: 1.0           # dollars per task, the run stops there
  obs_max_chars: 10000
  cmd_timeout: 120

# Prebuilt SWE-bench images from Docker Hub. Check this against the swebench version
# you installed before the first real run.
image_template: "swebench/sweb.eval.x86_64.{instance_id_1776}:latest"

# Every condition runs on the same tasks with the same model and agent.
# Set your strategy's params to what the paper used and cite them in docs/assignments/.
strategies:
  - name: full_history                # baseline, no context management
  - name: masking                     # Assignment A
    params: {}                        # e.g. {window: <paper value>}
  - name: summarization               # Assignment B
    params: {}
  - name: hybrid                      # Assignment C (rename to paging if you go with MemGPT)
    params: {}
  # Our own method goes here once we pick it on Dec 1.
